<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>NITRO FIGHTERS</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#080808;color:#f5c451;font-family:Arial,sans-serif;text-align:center}.game{max-width:600px;margin:auto;padding:12px;border:2px solid #bd902c;border-radius:16px;background:#12100b}h1{letter-spacing:3px;text-shadow:0 0 12px #dca52d}.owner{color:#f5c451;font-size:13px;letter-spacing:2px;font-weight:bold}.bars{display:flex;gap:10px;margin:16px 0}.side{flex:1;font-size:12px;font-weight:bold}.bar{height:16px;background:#382b14;border:1px solid #bd902c;border-radius:20px;overflow:hidden;margin-top:6px}.health{height:100%;width:100%;background:#f5c451;transition:width .2s}.enemybar{background:#ff4b55}.arena{height:260px;position:relative;overflow:hidden;border:1px solid #72531b;border-radius:10px;background:linear-gradient(#10131b 0%,#251a0b 68%,#080808 69%)}.arena:after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:#e4b340}.fighter{position:absolute;bottom:12px;width:65px;height:150px}#player{left:12%}#enemy{right:12%;transform:scaleX(-1)}.head{position:absolute;top:0;left:20px;width:27px;height:28px;border-radius:50%;background:#e4b383;border:3px solid #080808}.body{position:absolute;top:27px;left:13px;width:42px;height:55px;background:#d9a52e;border:3px solid #080808;border-radius:10px}#enemy .body{background:#d93442}.arm{position:absolute;top:35px;left:5px;width:15px;height:45px;background:#e4b383;border:3px solid #080808;border-radius:10px;transform:rotate(25deg)}.arm.two{left:45px;transform:rotate(-25deg)}.leg{position:absolute;top:78px;left:17px;width:17px;height:55px;background:#282828;border:3px solid #000;border-radius:8px;transform:rotate(8deg)}.leg.two{left:37px;transform:rotate(-8deg)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}button{border:1px solid #bd902c;border-radius:12px;padding:15px 5px;background:#21190b;color:#f5c451;font-weight:bold;font-size:14px;touch-action:manipulation}button:active{background:#624716}.special{background:#3a1015;border-color:#e74747;color:#ff9a9a}#message{min-height:24px;margin-top:12px;font-weight:bold}#overlay{position:absolute;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:15px;z-index:3;color:white}#overlay h2{color:#f5c451;font-size:28px;margin:0}#overlay button{padding:12px 25px;background:#f5c451;color:#080808}.hidden{display:none!important}.note{font-size:11px;color:#bca66f;margin-top:12px}
</style>
</head>
<body><div class="game">
<h1>NITRO FIGHTERS</h1><div class="owner">CREATED BY NITRO NELLY 👑</div><p>BLACK • GOLD • ARENA</p>
<div class="bars"><div class="side">NITRO NELLY<div class="bar"><div id="ph" class="health"></div></div></div><div class="side">SHADOW BOT<div class="bar"><div id="eh" class="health enemybar"></div></div></div></div>
<div class="arena"><div class="fighter" id="player"><div class="head"></div><div class="body"></div><div class="arm"></div><div class="arm two"></div><div class="leg"></div><div class="leg two"></div></div><div class="fighter" id="enemy"><div class="head"></div><div class="body"></div><div class="arm"></div><div class="arm two"></div><div class="leg"></div><div class="leg two"></div></div><div id="overlay"><h2>NITRO FIGHTERS</h2><p>Ready to fight?</p><button id="start">START FIGHT</button></div></div>
<div id="message">GET READY!</div><div class="controls"><button id="punch">👊 PUNCH</button><button id="kick">🦵 KICK</button><button id="block" class="special">🛡️ BLOCK</button><button id="special" class="special">⚡ SPECIAL</button></div><div style="margin-top:10px"><button id="restart">↻ RESTART</button></div><div class="note">TOUCH CONTROLS • FIGHT • WIN • PLAY AGAIN</div></div>
<script>
const $=id=>document.getElementById(id);let p=100,e=100,active=false,blocking=false,bot=null,wins=0;
function bars(){$("ph").style.width=p+"%";$("eh").style.width=e+"%"}function say(t){$("message").textContent=t}
function start(){clearInterval(bot);p=100;e=100;blocking=false;active=true;bars();$("overlay").classList.add("hidden");$("player").style.left="12%";$("enemy").style.right="12%";say("FIGHT!");bot=setInterval(()=>{if(!active)return;if(!blocking){p=Math.max(0,p-7);say("SHADOW BOT ATTACKS!")}else say("BLOCKED!");bars();check()},1100)}
function attack(type){if(!active)return;const a=$("player").getBoundingClientRect(),b=$("enemy").getBoundingClientRect();const d=Math.abs((a.left+a.width/2)-(b.left+b.width/2));if(d<230){e=Math.max(0,e-(type==="special"?30:type==="kick"?18:12));say(type==="special"?"NITRO SPECIAL! ⚡":type==="kick"?"POWER KICK!":"NICE PUNCH!")}else say("TOO FAR! TRY YOUR ATTACK!");bars();check()}
function check(){if(p<=0||e<=0){active=false;clearInterval(bot);if(e<=0)wins++;$("overlay").classList.remove("hidden");$("overlay").innerHTML="<h2>"+(e<=0?"YOU WIN! 🏆":"ROUND LOST")+"</h2><p>"+(e<=0?"Nitro Nelly wins!":"Try again, fighter!")+"</p><p>WINS: "+wins+"</p><button id='again'>PLAY AGAIN</button>";$("again").onclick=start}}
$("start").onclick=start;$("punch").onclick=()=>attack("punch");$("kick").onclick=()=>attack("kick");$("special").onclick=()=>attack("special");$("block").onpointerdown=()=>{blocking=true;say("BLOCKING!")};["pointerup","pointercancel","pointerleave"].forEach(ev=>$("block").addEventListener(ev,()=>blocking=false));
$("restart").onclick=()=>{clearInterval(bot);active=false;p=100;e=100;wins=0;bars();$("overlay").innerHTML="<h2>NITRO FIGHTERS</h2><p>Created by NITRO NELLY 👑</p><button id='start'>START FIGHT</button>";$("start").onclick=start;$("overlay").classList.remove("hidden");say("GET READY!")};
</script></body></html>
